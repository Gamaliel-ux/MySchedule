name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Runner.ipa Payload

      - name: Verify IPA
        run: |
          echo "=== IPA contents ==="
          unzip -l Runner.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-app
          path: Runner.ipa
